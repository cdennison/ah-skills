[project]
name = "agent-skills-search-app"
version = "0.1.0"
description = "Minimal Streamlit UI for the local agent skills Qdrant index"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118,<1",
  "litellm>=1.55,<2",
  "pydantic>=2.12,<3",
  "qdrant-client[fastembed]>=1.19,<2",
  "streamlit>=1.54,<2",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.35,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["search.py", "streamlit_app.py", "query_service.py", "scan_service.py", "scan_index.py", "tests"]
