# Standalone Qdrant server for this repo's pipeline.
#
# The pipeline's default mode is a local, embedded, on-disk Qdrant
# (QdrantClient(path="qdrant_db") — see docs/QUERY_INTERFACE.md) with no
# server process. That mode takes an exclusive path lock, so only one
# process (index_qdrant.py, query.py, or a frontend) can hold it at a time.
# This compose file is the alternative described there and in ROADMAP.md:
# run Qdrant as a server when concurrent independent processes (e.g. a
# Streamlit frontend staying up while a reindex runs) become a requirement,
# or ahead of a production deploy.
#
# Mirrors the version/ports/storage layout of the upstream Qdrant Helm
# chart defaults:
#   image:   docker.io/qdrant/qdrant:v1.18.2
#   ports:   6333 (HTTP), 6334 (gRPC)
#   storage: /qdrant/storage, /qdrant/snapshots
#
# Usage (run from this directory, docker/):
#   docker compose -f docker-compose.qdrant.yml up -d
#
# Stop:
#   docker compose -f docker-compose.qdrant.yml down
#
# Switching index_qdrant.py/query.py from embedded to this server means
# swapping QdrantClient(path=str(DB_PATH)) for QdrantClient(url="http://localhost:6333")
# — not done by this file; see docs/QUERY_INTERFACE.md before making that change.

services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.18.2
    container_name: search-demo-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage/storage:/qdrant/storage
      - ./qdrant_storage/snapshots:/qdrant/snapshots
